

name: Update PKGBUILD

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-pkgbuild
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools

      - name: Check upstream release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          repo="dsh-tauri/deepseek-harness-desktop"

          # Only the latest stable release
          release=$(gh api "repos/$repo/releases/latest")
          version=$(jq -r '.tag_name | ltrimstr("v")' <<< "$release")

          current=$(sed -n 's/^pkgver=//p' PKGBUILD)

          echo "Current: $current"
          echo "Upstream: $version"

          if [[ "$version" == "$current" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Locate the exact non-Bundle AMD64 Debian artifact
          filename="Deepseek.Harness.Desktop_${version}_amd64.deb"

          asset_id=$(jq -r --arg name "$filename" \
            '.assets[] | select(.name == $name) | .id' \
            <<< "$release")

          if [[ -z "$asset_id" ]]; then
            echo "Expected .deb asset missing"
            exit 1
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "asset_id=$asset_id" >> "$GITHUB_OUTPUT"

      - name: Download and update
        if: steps.release.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          ASSET_ID: ${{ steps.release.outputs.asset_id }}
        shell: bash
        run: |
          set -euo pipefail

          filename="Deepseek.Harness.Desktop_${VERSION}_amd64.deb"

          gh api \
            -H "Accept: application/octet-stream" \
            "repos/dsh-tauri/deepseek-harness-desktop/releases/assets/${ASSET_ID}" \
            > "$filename"

          # Fail if the download is not a Debian archive
          bsdtar -tf "$filename" | grep -q 'data.tar'

          checksum=$(sha256sum "$filename" | cut -d' ' -f1)

          sed -i \
            -e "s/^pkgver=.*/pkgver=${VERSION}/" \
            -e "s/^pkgrel=.*/pkgrel=1/" \
            -e "s/^sha256sums_x86_64=.*/sha256sums_x86_64=('${checksum}')/" \
            PKGBUILD
          # Generate .SRCINFO in a writable container directory
          docker run --rm \
          -v "$PWD/PKGBUILD:/tmp/PKGBUILD:ro" \
          archlinux:latest \
          bash -euc '
          useradd -m builder
          cp /tmp/PKGBUILD /home/builder/PKGBUILD
          chown builder:builder /home/builder/PKGBUILD
          cd /home/builder
          runuser -u builder -- makepkg --printsrcinfo
          ' > .SRCINFO

          echo "Updated to $VERSION"
          git diff -- PKGBUILD .SRCINFO

      - name: Create Pull Request
        if: steps.release.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/update-pkgbuild
          delete-branch: true
          add-paths: |
            PKGBUILD
            .SRCINFO
          commit-message: "chore: update PKGBUILD to ${{ steps.release.outputs.version }}"
          title: "chore: update to v${{ steps.release.outputs.version }}"
          body: |
            Automated upstream release update.

            - Update pkgver and reset pkgrel
            - Download the official amd64 Debian package
            - Calculate SHA256 checksum
            - Regenerate .SRCINFO

            Please review package layout and test with makepkg before merging.
